name: Purchase group regression
on:
  push:
    branches: [feature/measurement-spec-3]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/purchase-group.cjs
      - run: node scripts/sync-pwa.cjs --check
