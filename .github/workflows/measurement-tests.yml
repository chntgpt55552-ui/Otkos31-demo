name: Measurement regression
on:
  pull_request:
    branches: [main]
jobs:
  measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/measurement-constructor-transition.test.cjs
